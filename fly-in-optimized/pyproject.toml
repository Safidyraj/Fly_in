[project]
name = "fly-in"
version = "0.1.0"
description = "Design an efficient drone routing system that navigates multiple drones"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygame>=2.6.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
]

[tool.mypy]
exclude = ["\\.venv", "^io/"]

[tool.flake8]
exclude = [".venv", "io", "__pycache__"]
extend-ignore = [
    "E126",
    "E127",
    "E128",
    "E125",
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D202",
    "D205",
    "D209",
    "D301",
    "D400",
    "D401",
    "D403",
    "W503",
    "F401",
]
